<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psicconsciente en móvil · maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:only light;
  --suelo:#FFFFFF;
  --blanco:#FFFFFF;
  --txt:#2C3E50;
  --txt-suave:#55697A;
  --marron:#5E442C;
  --marron-txt:#FAF3EA;
  --marron-txt-sv:#E2D5C4;
  --terra:#A87453;
  --terra-dp:#8C6246;
  --terra-sv:#F3E9DE;
  --linea:rgba(166,123,91,.22);
  --fondo-suave:#FBF7F2;
  --piz:#3D5568;
  --piz-dp:#2F4455;
  --piz-sv:#E7EDF1;
  --piz-borde:rgba(61,85,104,.35);
  --display:Fraunces,Georgia,serif;
  --texto:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sombra:0 1px 2px rgba(94,68,44,.06),0 10px 28px -12px rgba(94,68,44,.22);
  --r:16px;
  --paso:180ms cubic-bezier(.2,.8,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#E6DACB;color:var(--txt);
  font:400 1rem/1.5 var(--texto);-webkit-font-smoothing:antialiased;
}
::selection{background:var(--piz-sv);color:var(--piz-dp)}
button{font:inherit;color:inherit}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--piz);outline-offset:2px}

.lienzo{display:flex;flex-wrap:wrap;justify-content:center;gap:2.5rem;padding:2rem 1rem 3rem}
.lienzo > header{flex-basis:100%;text-align:center}
.lienzo > header h1{margin:0;font:600 1.5rem/1.2 var(--display)}
.lienzo > header p{margin:.4rem auto 0;max-width:46ch;color:var(--txt-suave)}
figure{margin:0}
figcaption{text-align:center;margin-bottom:.75rem;font-weight:600;color:var(--txt-suave)}

.tel{
  position:relative;width:390px;height:844px;overflow:hidden;
  border-radius:44px;background:var(--suelo);
  box-shadow:0 0 0 10px #2A211A,0 30px 60px -20px rgba(42,33,26,.5);
  display:flex;flex-direction:column;
}
.pantalla{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.pantalla::-webkit-scrollbar{display:none}

.banda{
  background:var(--marron);color:var(--marron-txt);
  padding:3.25rem 1rem 4.5rem;
}
.barra{
  display:flex;align-items:center;gap:.75rem;
  background:var(--blanco);color:var(--txt);border-radius:var(--r);
  padding:.5rem .5rem .5rem 1rem;box-shadow:var(--sombra);
}
.barra .marca{display:flex;align-items:center;gap:.5rem;font:600 1.05rem var(--display);margin-right:auto}
.barra .marca svg{color:var(--terra)}
.avatar{
  width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;background:var(--terra-sv);color:var(--marron);
  font-weight:700;font-size:.95rem;letter-spacing:.02em;
}
.saludo{margin:1.5rem .25rem 0}
.saludo h2{margin:0;font:600 2rem/1.1 var(--display);letter-spacing:-.02em}
.saludo p{margin:.35rem 0 0;color:var(--marron-txt-sv)}

.proxima{
  margin:-3.25rem 1rem 0;position:relative;
  background:var(--blanco);border-radius:20px;box-shadow:var(--sombra);
  padding:1.25rem;
}
.proxima h3{margin:0 0 .9rem;font:600 1.05rem var(--display);color:var(--terra-dp)}
.cuando{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}
.cuando .dia{margin:0;font:600 1.45rem/1.15 var(--display)}
.cuando .hora{margin:0;font:700 2.1rem/1 var(--texto);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.datos{list-style:none;margin:1rem 0 0;padding:1rem 0 0;border-top:1px solid var(--linea);display:grid;gap:.55rem}
.datos li{display:flex;align-items:center;gap:.6rem;color:var(--txt-suave)}
.datos svg{color:var(--terra)}
.estado{
  display:inline-flex;align-items:center;gap:.35rem;margin-left:auto;
  background:var(--piz-sv);color:var(--piz-dp);border-radius:999px;
  padding:.15rem .7rem;font-size:.875rem;font-weight:600;
}
.estado svg{width:16px;height:16px;color:var(--piz)}
.acciones{display:flex;align-items:center;gap:1rem;margin-top:1.1rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:48px;padding:0 1.25rem;border:0;border-radius:999px;cursor:pointer;
  background:var(--piz);color:#fff;font-weight:600;font-size:1rem;
  transition:background var(--paso),transform 120ms ease-out;
}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#C9D1D8;color:#5E6B76;cursor:not-allowed}
.enlace{color:var(--piz);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--piz-borde);min-height:44px;display:inline-flex;align-items:center}

.atajos{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem}
.atajo{
  display:flex;align-items:center;gap:.55rem;min-height:64px;padding:.75rem;white-space:nowrap;
  background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);
  text-decoration:none;color:var(--txt);font-weight:600;
}
.atajo .burbuja{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--piz-sv);color:var(--piz)}
.atajo:last-child .burbuja{background:var(--terra-sv);color:var(--terra-dp)}

.bloque{margin:1.5rem 1rem 0}
.bloque > h3{margin:0 0 .6rem;font:600 1.1rem var(--display)}
.tarjeta{
  display:flex;align-items:center;gap:.9rem;padding:1rem;border-radius:var(--r);
  background:var(--blanco);border:1px solid var(--linea);
}
.tarjeta + .tarjeta{margin-top:.6rem}
.tarjeta .burbuja{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-paquete{background:var(--terra-sv);border-color:transparent}
.t-paquete .burbuja{background:var(--blanco);color:var(--terra-dp)}
.t-historial .burbuja{background:var(--piz-sv);color:var(--piz)}
.tarjeta .txt{flex:1;min-width:0}
.tarjeta strong{display:block;font-weight:600}
.tarjeta small{display:block;color:var(--txt-suave);font-size:.9rem}
.tarjeta .cifra{font:700 1.5rem/1 var(--texto);font-variant-numeric:tabular-nums;text-align:right}
.tarjeta .cifra small{font:400 .8rem var(--texto)}
.medidor{height:6px;border-radius:99px;background:rgba(140,98,70,.18);margin-top:.5rem;overflow:hidden}
.medidor span{display:block;height:100%;width:33%;background:var(--terra);border-radius:inherit}

.nav{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--blanco);border-top:1px solid var(--linea);
  padding:.35rem .5rem calc(.35rem + 18px);
}
.nav a{
  display:flex;flex-direction:column;align-items:center;gap:.15rem;min-height:52px;justify-content:center;
  text-decoration:none;color:var(--txt-suave);font-size:.8rem;font-weight:600;border-radius:12px;
}
.nav a[aria-current="page"]{color:var(--piz)}
.nav a[aria-current="page"] svg{background:var(--piz-sv);border-radius:99px;width:52px;padding:2px 14px;box-sizing:content-box;height:22px}
.nav a.central svg{color:var(--terra-dp)}

.appbar{
  background:var(--marron);color:var(--marron-txt);
  padding:3.1rem .5rem .75rem;display:flex;align-items:center;gap:.25rem;
}
.appbar h2{margin:0 auto 0 .25rem;font:600 1.2rem var(--display)}
.icono-btn{
  width:44px;height:44px;border-radius:50%;border:0;background:none;color:inherit;cursor:pointer;
  display:grid;place-items:center;
}
.icono-btn:active{background:rgba(255,246,232,.14)}
.pasos{
  background:var(--marron);padding:0 1.25rem 1.1rem;
}
.pasos ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.pasos ol::before{content:"";position:absolute;top:14px;left:16.66%;right:16.66%;height:2px;background:rgba(255,246,232,.22)}
.pasos li{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--marron-txt-sv);font-size:.85rem}
.pasos .n{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#7A5C42;color:var(--marron-txt);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;
}
.pasos li[aria-current="step"]{color:var(--marron-txt);font-weight:600}
.pasos li[aria-current="step"] .n{background:var(--blanco);color:var(--marron);box-shadow:0 0 0 4px rgba(255,246,232,.2)}
.pasos li.hecho .n{background:var(--terra-sv);color:var(--terra-dp)}
.pasos li.hecho .n svg{width:16px;height:16px;stroke-width:2.5}

.hoja{
  background:var(--suelo);border-radius:22px 22px 0 0;margin-top:-10px;position:relative;
  padding:1.25rem 1rem 7.5rem;min-height:100%;
}
.hoja h3{margin:0 0 .65rem;font:600 1.1rem var(--display)}
.hoja section + section{margin-top:1.5rem}
.lista{display:grid;gap:.5rem}
.op{
  display:flex;align-items:center;gap:.85rem;width:100%;min-height:60px;padding:.8rem 1rem;
  background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  text-align:left;cursor:pointer;transition:border-color var(--paso),background var(--paso);
}
.op .txt{flex:1;min-width:0}
.op strong{display:block;font-weight:600}
.op small{display:block;color:var(--txt-suave);font-size:.9rem}
.op .burbuja{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--terra-sv);color:var(--terra-dp);flex:none}
.op .marca-sel{
  width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid var(--terra);transition:background var(--paso),border-color var(--paso);
}
.op .marca-sel svg{width:14px;height:14px;stroke-width:3;color:#fff;opacity:0}
.op[aria-checked="true"]{border-color:var(--piz-borde);background:var(--piz-sv)}
.op[aria-checked="true"] strong{color:var(--piz-dp)}
.op[aria-checked="true"] .marca-sel{background:var(--piz);border-color:var(--piz)}
.op[aria-checked="true"] .marca-sel svg{opacity:1}
.precio{font:700 1.15rem var(--texto);font-variant-numeric:tabular-nums;color:var(--terra-dp);white-space:nowrap}
.ahorro{display:inline-block;margin-top:.15rem;font-size:.85rem;font-weight:600;color:var(--terra-dp)}
.nota{margin:.6rem .25rem 0;font-size:.9rem;color:var(--txt-suave);display:flex;gap:.5rem;align-items:flex-start}
.nota svg{width:18px;height:18px;color:var(--terra);margin-top:.15rem}

.pie-fijo{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--blanco);border-top:1px solid var(--linea);
  padding:.75rem 1rem calc(.75rem + 18px);
}
.pie-fijo .btn{width:100%}
.pie-fijo p{margin:0 0 .5rem;text-align:center;font-size:.85rem;color:var(--txt-suave)}
.pie-fijo p a{color:var(--piz);text-underline-offset:2px}

.resumen{
  display:flex;align-items:center;gap:.5rem;margin:0 0 1.1rem;padding:0 .5rem 0 1rem;
  background:var(--blanco);border:1px solid var(--linea);border-radius:999px;font-size:.9rem;color:var(--txt-suave);
}
.resumen span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumen a{color:var(--piz);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 .35rem}

.cal{background:var(--blanco);border-radius:18px;border:1px solid var(--linea);padding:.75rem .6rem .9rem}
.cal-cab{display:flex;align-items:center;padding:0 .25rem .4rem .5rem}
.cal-cab h3{margin:0 auto 0 0;font:600 1.1rem var(--display)}
.cal-cab .icono-btn{color:var(--piz)}
.cal-cab .icono-btn:disabled{color:#B9C2CA;cursor:default}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:.8rem;font-weight:600;color:var(--txt-suave);padding:.25rem 0 .35rem}
.cal td{padding:2px;text-align:center}
.dia-btn{
  width:44px;height:44px;margin:0 auto;border-radius:50%;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;position:relative;
  font:500 1.05rem var(--texto);font-variant-numeric:tabular-nums;color:var(--txt);
  transition:background var(--paso),color var(--paso);
}
.dia-btn[aria-disabled="true"]{color:#B4BCC4;cursor:default}
.dia-btn.hoy::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--terra)}
.dia-btn[aria-pressed="true"]{background:var(--piz);color:#fff;font-weight:700}
.dia-btn[aria-pressed="true"].hoy::after{background:#fff}
.cal-nota{margin:.4rem .5rem 0;font-size:.85rem;color:var(--txt-suave)}

.horas{margin-top:1.25rem}
.horas h3 span{display:block;font:400 .9rem var(--texto);color:var(--txt-suave);margin-top:.1rem}
.franja{margin-top:.9rem}
.franja h4{margin:0 0 .45rem;font-size:.85rem;font-weight:600;color:var(--terra-dp)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.chip{
  min-height:48px;border-radius:12px;border:1px solid var(--piz-borde);background:var(--blanco);cursor:pointer;
  font:600 1.05rem var(--texto);font-variant-numeric:tabular-nums;color:var(--piz-dp);
  transition:background var(--paso),color var(--paso),transform 120ms ease-out;
}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--piz);border-color:var(--piz);color:#fff}

.aviso-suave{display:flex;gap:.6rem;align-items:flex-start;margin:0;padding:.85rem 1rem;border-radius:14px;background:var(--terra-sv);color:var(--marron);font-size:.95rem}
.aviso-suave svg{width:20px;height:20px;color:var(--terra-dp);margin-top:.1rem}
.importe{border:1px solid var(--linea);border-radius:18px;padding:1.1rem 1.25rem;background:var(--blanco);display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.importe .etq{margin:0;font-size:.9rem;font-weight:600;color:var(--terra-dp)}
.importe .cifra{margin:.15rem 0 .1rem;font:700 2.2rem/1.1 var(--texto);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.importe .cifra small{font-size:1.1rem;font-weight:600;margin-left:.3rem;color:var(--txt-suave)}
.importe .ref{margin:0;color:var(--txt-suave);font-size:.9rem;font-variant-numeric:tabular-nums}
.copiar{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:0 1rem;border-radius:999px;border:1px solid var(--piz-borde);background:var(--blanco);color:var(--piz);font-weight:600;cursor:pointer;transition:background var(--paso)}
.copiar:hover{background:var(--piz-sv)}
.copiar svg{width:18px;height:18px}
.copiar[data-hecho]{background:var(--piz-sv);border-color:transparent}
.titulo-paso{display:flex;align-items:center;gap:.6rem;margin:0 0 .75rem;font:600 1.1rem var(--display)}
.titulo-paso .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--terra-sv);color:var(--marron);font:700 .85rem var(--texto)}
.cuenta-banco{border:1px solid var(--linea);border-radius:18px;overflow:hidden;background:var(--blanco)}
.cuenta-cab{display:flex;align-items:center;gap:.75rem;padding:.9rem 1rem;border-bottom:1px solid var(--linea)}
.sello{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#A3302A;color:#fff;font-weight:700;font-size:.8rem;flex:none}
.cuenta-cab strong{display:block;font-weight:600}
.cuenta-cab small{display:block;color:var(--txt-suave);font-size:.875rem}
.dato{display:flex;align-items:center;gap:1rem;padding:.55rem .6rem .55rem 1rem}
.dato + .dato{border-top:1px solid var(--linea)}
.dato > span{flex:1;min-width:0}
.dato small{display:block;font-size:.85rem;color:var(--txt-suave)}
.dato b{font-weight:600;font-variant-numeric:tabular-nums;font-size:1.05rem}
.form-pago{display:grid;gap:1.05rem}
.campo{display:grid;gap:.35rem;min-width:0;align-content:start}
.campo label,.campo .lbl{font-weight:600;font-size:.95rem}
.campo input,.campo select{width:100%;min-height:48px;border:1px solid rgba(166,123,91,.45);border-radius:12px;padding:0 .9rem;font:inherit;color:var(--txt);background:var(--blanco)}
.campo input{font-variant-numeric:tabular-nums}
.campo input::placeholder{color:#8A96A1}
.campo input:focus,.campo select:focus{outline:2px solid var(--piz);outline-offset:1px;border-color:var(--piz)}
.campo .ayuda{font-size:.85rem;color:var(--txt-suave);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{min-height:44px;padding:0 1.1rem;border-radius:999px;border:1px solid var(--piz-borde);background:var(--blanco);color:var(--piz-dp);font-weight:600;cursor:pointer;transition:background var(--paso),color var(--paso)}
.seg button[aria-checked="true"]{background:var(--piz);border-color:var(--piz);color:#fff}
.subir{position:relative;display:flex;align-items:center;gap:.85rem;padding:1rem;border:1.5px dashed rgba(166,123,91,.55);border-radius:14px;cursor:pointer;background:var(--fondo-suave)}
.subir:hover{border-color:var(--piz-borde)}
.subir:focus-within{outline:2px solid var(--piz);outline-offset:2px}
.subir .burbuja{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--piz-sv);color:var(--piz);flex:none}
.subir strong{display:block;color:var(--piz);font-weight:600}
.subir small{display:block;color:var(--txt-suave);font-size:.875rem}
.subir input{position:absolute;inset:0;opacity:0;cursor:pointer}
.auxilio{margin:0;font-size:.9rem;color:var(--txt-suave);text-align:center}
.auxilio a{color:var(--piz);font-weight:600;text-underline-offset:2px}
.hoja .bloque-pago{margin-top:1.5rem}
.hoja .importe{margin-top:1rem}

.banda,.cabeza-app{
  position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(155deg,#7A5638 0%,#5E442C 46%,#3F2C1C 100%);
}
.banda::before,.cabeza-app::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(38deg,rgba(255,246,232,.075) 0 16px,rgba(255,246,232,0) 30px 74px),
    repeating-linear-gradient(-49deg,rgba(255,246,232,.055) 0 12px,rgba(255,246,232,0) 26px 66px);
  -webkit-mask-image:radial-gradient(80% 120% at 100% 0%,#000 0%,rgba(0,0,0,.55) 40%,transparent 80%);
  mask-image:radial-gradient(80% 120% at 100% 0%,#000 0%,rgba(0,0,0,.55) 40%,transparent 80%);
}
.banda::after,.cabeza-app::after{
  content:"";position:absolute;z-index:-1;pointer-events:none;
  width:420px;height:420px;right:-140px;top:-220px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(232,196,150,.28),rgba(232,196,150,0));
}
.cabeza-app .appbar,.cabeza-app .pasos{background:none}

.caja{border:1px solid var(--linea);border-radius:18px;overflow:hidden;background:var(--blanco)}
.caja-cab{
  position:relative;display:flex;align-items:center;gap:.75rem;padding:.9rem 1.1rem;
  border-bottom:1px solid var(--linea);
}
.caja-cab::after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:46%;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);
  mask-image:linear-gradient(90deg,transparent,#000 70%);
}
.caja-cab .num{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  font:700 .9rem var(--texto);position:relative;z-index:1;
}
.caja-cab div{position:relative;z-index:1}
.caja-cab h3{margin:0;font:600 1.1rem/1.2 var(--display)}
.caja-cab small{display:block;font-size:.9rem;margin-top:.1rem}
.caja-pago .caja-cab{background:var(--terra-sv)}
.caja-pago .caja-cab::after{background-image:radial-gradient(circle,rgba(140,98,70,.32) 1.3px,transparent 1.8px);background-size:11px 11px}
.caja-pago .caja-cab .num{background:var(--terra-dp);color:#fff}
.caja-pago .caja-cab h3{color:var(--marron)}
.caja-pago .caja-cab small{color:#6B5340}

.caja-form .caja-cab small{color:#4A5F70}

.importe{border:0;border-radius:0;padding:0 0 1rem;border-bottom:1px solid var(--linea)}
.lbl-suelta{display:block;margin:0 0 .5rem;font-weight:600;font-size:.95rem}
.bancos{display:flex;flex-wrap:wrap;gap:.5rem}
.banco-op{
  display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 .9rem 0 .4rem;
  border-radius:999px;border:1px solid var(--linea);background:var(--blanco);cursor:pointer;
  font-weight:600;color:var(--txt);transition:border-color var(--paso),background var(--paso);
}
.banco-op .sello{width:32px;height:32px;font-size:.7rem}
.banco-op[aria-checked="true"]{border-color:var(--piz);background:var(--piz-sv);color:var(--piz-dp);box-shadow:inset 0 0 0 1px var(--piz)}
.cuenta-banco{margin-top:.75rem}

.subir{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:.35rem;min-height:190px;padding:1.5rem 1.25rem;
  border:1.5px dashed rgba(61,85,104,.4);border-radius:16px;background:var(--fondo-suave);cursor:pointer;
  transition:border-color var(--paso),background var(--paso);
}
.subir:hover,.subir[data-encima]{border-color:var(--piz);background:var(--piz-sv)}
.subir:focus-within{outline:2px solid var(--piz);outline-offset:2px}
.subir input{position:absolute;inset:0;opacity:0;cursor:pointer}
.subir-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--blanco);color:var(--piz);box-shadow:0 0 0 6px rgba(61,85,104,.08);margin-bottom:.4rem}
.subir-ic svg{width:26px;height:26px}
.subir strong{display:block;font-weight:600;font-size:1.05rem;color:var(--txt)}
.subir small{display:block;color:var(--txt-suave);font-size:.9rem;max-width:38ch;text-wrap:balance}
.titular{margin:0;padding:.7rem 1rem;border-bottom:1px solid var(--linea);font-size:.9rem;color:var(--txt-suave);background:var(--fondo-suave)}
.titular strong{color:var(--txt);font-weight:600}
.subir .falso-btn{
  display:inline-flex;align-items:center;min-height:44px;padding:0 1.2rem;margin-top:.6rem;border-radius:999px;
  background:var(--blanco);box-shadow:inset 0 0 0 1px var(--piz-borde);color:var(--piz);font-weight:600;
}
.previa{display:flex;align-items:center;gap:.9rem;padding:.75rem;border:1px solid var(--piz-borde);border-radius:16px;background:var(--piz-sv)}
.previa img,.previa .pdf{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:var(--blanco);display:grid;place-items:center;color:var(--piz);font-weight:700}
.previa .txt{flex:1;min-width:0}
.previa strong{display:flex;align-items:center;gap:.35rem;font-weight:600;color:var(--piz-dp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previa strong svg{width:18px;height:18px;flex:none;stroke-width:2.5}
.previa small{display:block;color:var(--txt-suave);font-size:.875rem}
.previa button{min-height:44px;padding:0 1rem;border-radius:999px;border:0;background:var(--blanco);color:var(--piz);font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--piz-borde)}
.pila-pago{display:grid;gap:1rem;margin-top:1rem}

.subir{
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.85rem;row-gap:.1rem;
  align-items:center;justify-items:start;text-align:left;min-height:0;padding:.7rem .7rem .7rem .7rem;
  border:1px solid var(--piz-borde);border-radius:16px;background:var(--blanco);
}
.subir:hover,.subir[data-encima]{background:var(--piz-sv);border-color:var(--piz)}
.subir-ic{
  grid-row:1 / 3;position:relative;width:60px;height:60px;margin:0;border-radius:14px;box-shadow:none;
  background:var(--piz-sv) radial-gradient(circle,rgba(61,85,104,.22) 1.1px,transparent 1.6px) 0 0/9px 9px;
  color:var(--piz);display:grid;place-items:center;
}
.subir-ic > svg{width:26px;height:26px}
.subir-ic .mas{
  position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;background:var(--piz);color:#fff;box-shadow:0 0 0 2px var(--blanco);
}
.subir-ic .mas svg{width:14px;height:14px;stroke-width:2.5}
.subir strong{grid-column:2;align-self:end;font-size:1rem;color:var(--piz)}
.subir small{grid-column:2;align-self:start;max-width:none;font-size:.85rem}
.subir .falso-btn{grid-column:3;grid-row:1 / 3;margin:0;min-height:44px;padding:0 .9rem;background:var(--piz);color:#fff;box-shadow:none}
.previa{padding:.7rem;border-radius:16px}
.previa[hidden],.subir[hidden]{display:none}
.previa img,.previa .pdf{width:60px;height:60px;border-radius:14px}

@media (max-width:440px){
  body{background:var(--suelo)}
  .lienzo{padding:0;gap:0}
  .lienzo > header{padding:1.25rem 1rem}
  figure{width:100%}
  figcaption{padding:.75rem 0;background:#E6DACB}
  .tel{width:100%;border-radius:0;box-shadow:none;height:100svh}
}
@media (prefers-reduced-motion:reduce){

  .btn:active,.chip:active{transform:none}
}

                <span class="lbl-suelta" id="mlblBanco">Elige la cuenta</span>
                <div class="bancos" role="radiogroup" aria-labelledby="mlblBanco"></div>
                <div class="cuenta-banco"></div>
              </div>
            </div>
          </section>
          <section class="caja caja-form" aria-labelledby="mtForm">
            <header class="caja-cab"><span class="num">2</span><div><h3 id="mtForm">Cuéntanos del pago</h3><small>Con esto Daryeli lo encuentra en su banco</small></div></header>
            <form class="caja-cuerpo form-pago" onsubmit="return false">
              <div class="campo">
                <label for="mbanco">Banco desde el que pagaste</label>
                <select id="mbanco"><option>Selecciona tu banco</option><option>Banco de Venezuela</option><option>Banesco</option><option>Mercantil</option><option>Provincial</option></select>
              </div>
              <div class="campo">
                <label for="mref">Número de referencia</label>
                <input id="mref" type="text" inputmode="numeric" placeholder="000123456789" autocomplete="off">
                <p class="ayuda">Los dígitos que salen en el comprobante.</p>
              </div>
              <div class="campo">
                <label for="mmonto">Monto en bolívares</label>
                <input id="mmonto" type="text" inputmode="decimal" value="16.155,00">
                <p class="ayuda">Ya viene puesto. Cámbialo si tu banco cobró otra cifra.</p>
              </div>
              <div class="campo">
                <span class="lbl" id="mlblCuando">¿Cuándo lo pagaste?</span>
                <div class="seg" role="radiogroup" aria-labelledby="mlblCuando">
                  <button type="button" role="radio" aria-checked="true">Hoy</button>
                  <button type="button" role="radio" aria-checked="false">Ayer</button>
                  <button type="button" role="radio" aria-checked="false">Otra fecha</button>
                </div>
              </div>
              <div class="campo zona-captura">
                <span class="lbl" id="mlblCap">Captura del comprobante</span>
                <label class="subir">
                  <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" aria-labelledby="mlblCap">
                  <span class="subir-ic"><svg class="ic"><use href="#i-foto"/></svg><i class="mas" aria-hidden="true"><svg class="ic"><use href="#i-mas"/></svg></i></span>
                  <strong>Sube la captura</strong>
                  <small>JPG, PNG o PDF · 5 MB</small>
                </label>
                <div class="previa" hidden></div>
              </div>
            </form>
          </section>
          </div>
        </div>
      </div>
      <div class="pie-fijo">
        <button class="btn" type="button">Enviar comprobante</button>
        <p class="auxilio" style="margin:.5rem 0 0">¿Algo no cuadra? <a href="#">Escríbele a Daryeli</a></p>
      </div>
    </div>
  </figure>
</main>

<script>
(function () {
  document.querySelectorAll('[role="radiogroup"]').forEach(function (g) {
    g.addEventListener('click', function (e) {
      var b = e.target.closest('.op');
      if (!b) return;
      g.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-checked', String(x === b)); });
    });
  });

  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var cuerpo = document.getElementById('calDias');
  var primero = new Date(2026, 9, 1);
  var hueco = (primero.getDay() + 6) % 7;
  var elegido = 19;
  var fila = document.createElement('tr');
  for (var i = 0; i < hueco; i++) fila.appendChild(document.createElement('td'));
  for (var d = 1; d <= 31; d++) {
    var f = new Date(2026, 9, d);
    var td = document.createElement('td');
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'dia-btn' + (d === 19 ? ' hoy' : '');
    b.textContent = d;
    b.dataset.d = d;
    var cerrado = d < 19 || f.getDay() === 0;
    if (cerrado) b.setAttribute('aria-disabled', 'true');
    else b.setAttribute('aria-pressed', String(d === elegido));
    b.setAttribute('aria-label', DIAS[f.getDay()] + ', ' + d + ' de octubre' + (cerrado ? ', sin horarios' : ''));
    td.appendChild(b);
    fila.appendChild(td);
    if ((hueco + d) % 7 === 0) { cuerpo.appendChild(fila); fila = document.createElement('tr'); }
  }
  if (fila.children.length) cuerpo.appendChild(fila);

  var hora = '19:00';
  var boton = document.getElementById('reservar');
  function pintar() {
    var f = new Date(2026, 9, elegido);
    document.getElementById('tDia').firstChild.nodeValue =
      DIAS[f.getDay()].replace(/^./, function (c) { return c.toUpperCase(); }) + ', ' + elegido + ' de octubre';
    boton.textContent = hora ? 'Reservar ' + DIAS[f.getDay()] + ' ' + elegido + ' · ' + hora : 'Elige una hora';
    boton.disabled = !hora;
  }
  cuerpo.addEventListener('click', function (e) {
    var b = e.target.closest('.dia-btn');
    if (!b || b.getAttribute('aria-disabled') === 'true') return;
    elegido = Number(b.dataset.d);
    cuerpo.querySelectorAll('.dia-btn[aria-pressed]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    hora = null;
    document.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    pintar();
  });
  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      hora = c.textContent;
      document.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === c)); });
      pintar();
    });
  });

  document.addEventListener('click', function (e) {
    var c = e.target.closest('.copiar');
    if (c) {
      try { navigator.clipboard.writeText(c.dataset.copiar); } catch (x) {}
      var et = c.querySelector('span');
      var antes = et ? et.textContent : '';
      c.setAttribute('data-hecho', '');
      if (et) et.textContent = 'Copiado';
      setTimeout(function () { c.removeAttribute('data-hecho'); if (et) et.textContent = antes; }, 1600);
      return;
    }
    var s = e.target.closest('.seg button');
    if (s) s.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-checked', String(x === s)); });
  });

  var BANCOS = [
    { sig: 'BDV', nombre: 'Banco de Venezuela', color: '#A3302A', ced: 'V-12.345.678', tel: '0412-000.00.00' },
    { sig: 'BAN', nombre: 'Banesco', color: '#1E6B45', ced: 'V-12.345.678', tel: '0414-000.00.00' },
    { sig: 'MER', nombre: 'Mercantil', color: '#1F4E8C', ced: 'V-12.345.678', tel: '0424-000.00.00' }
  ];
  function copiarBtn(v, et) {
    return '<button class="copiar" type="button" data-copiar="' + v.replace(/\D/g, '') + '" aria-label="Copiar ' + et.toLowerCase() + '"><svg class="ic"><use href="#i-copiar"/></svg><span>Copiar</span></button>';
  }
  function pintarBanco(caja, i) {
    var b = BANCOS[i];
    caja.querySelector('.cuenta-banco').innerHTML =
      '<p class="titular">Pago móvil a nombre de <strong>Daryeli Romero</strong></p>' +
      '<div class="dato"><span><small>Cédula</small><b>' + b.ced + '</b></span>' + copiarBtn(b.ced, 'Cédula') + '</div>' +
      '<div class="dato"><span><small>Teléfono</small><b>' + b.tel + '</b></span>' + copiarBtn(b.tel, 'Teléfono') + '</div>';
  }
  document.querySelectorAll('.caja-pago').forEach(function (caja) {
    var g = caja.querySelector('.bancos');
    g.innerHTML = BANCOS.map(function (b, i) {
      return '<button class="banco-op" type="button" role="radio" aria-checked="' + (i === 0) + '" data-i="' + i + '"><span class="sello" style="background:' + b.color + '" aria-hidden="true">' + b.sig + '</span>' + b.nombre + '</button>';
    }).join('');
    g.addEventListener('click', function (e) {
      var o = e.target.closest('.banco-op');
      if (!o) return;
      g.querySelectorAll('.banco-op').forEach(function (x) { x.setAttribute('aria-checked', String(x === o)); });
      pintarBanco(caja, Number(o.dataset.i));
    });
    pintarBanco(caja, 0);
  });

  function tam(n) { return n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.round(n / 1024) + ' KB'; }
  document.querySelectorAll('.zona-captura').forEach(function (z) {
    var lab = z.querySelector('.subir');
    var inp = lab.querySelector('input');
    var prev = z.querySelector('.previa');
    function mostrar(f) {
      if (!f) return;
      var es = /^image\//.test(f.type);
      prev.innerHTML = (es ? '<img alt="" src="' + URL.createObjectURL(f) + '">' : '<span class="pdf">PDF</span>') +
        '<span class="txt"><strong><svg class="ic"><use href="#i-check"/></svg>' + f.name + '</strong><small>' + tam(f.size) + ' · lista para enviar</small></span>' +
        '<button type="button">Cambiar</button>';
      prev.hidden = false; lab.hidden = true;
      prev.querySelector('button').addEventListener('click', function () { inp.value = ''; prev.hidden = true; lab.hidden = false; inp.click(); });
    }
    inp.addEventListener('change', function () { mostrar(inp.files[0]); });
    ['dragenter', 'dragover'].forEach(function (t) { lab.addEventListener(t, function () { lab.setAttribute('data-encima', ''); }); });
    ['dragleave', 'drop'].forEach(function (t) { lab.addEventListener(t, function () { lab.removeAttribute('data-encima'); }); });
  });
})();
</script>
</body>
</html>
