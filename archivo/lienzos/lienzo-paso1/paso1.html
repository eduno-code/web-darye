<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paso 1 · carpeta</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">

<!-- ============================================================
     PASO 1 · SOLO ESCRITORIO. El movil se disena aparte y sera otra cosa.

     ESTO ES UNA CARPETA. Es lo que pidio Edgar y lo que ensena su referencia:
     tres pestanas colgando de un unico contenedor, y el trazo hecho con BORDE
     GRUESO en marron fuerte, no con sombras.

     LO QUE HACE EL EFECTO CARPETA, que es un solo detalle y es el importante:
     la pestana activa es LA MISMA SUPERFICIE que el contenedor y NO HAY
     COSTURA entre las dos. Se consigue con tres cosas a la vez:
       1. mismo relleno (blanco) en pestana activa y contenedor,
       2. `border-bottom:0` en la activa,
       3. `margin-bottom:-2px` para que se monte encima del borde superior del
          contenedor y lo tape.
     Si falta cualquiera de las tres aparece una linea entre pestana y carton, y
     entonces ya no es una carpeta: son tres botones encima de una caja.

     SE RETIRO LA BANDA MARRON de detras de las pestanas. Las pestanas apoyan
     directamente en el fondo tintado, como en la referencia.

     EL REPARTO lo decidio el bosquejo de Edgar: modalidad a la izquierda, que
     quieres trabajar a la derecha, planes abajo cruzando el ancho.

     LAS DOS COLUMNAS NO MIDEN LO MISMO A PROPOSITO. La modalidad tiene dos
     opciones y la terapia cuatro con descripcion: cada bloque mide lo que pide
     su contenido y ninguno se estira por rellenar hueco.
     ============================================================ -->

<style>
:root{
  color-scheme:only light;

  --tinte:#F6EFE7;          /* el suelo */
  --blanco:#FFFFFF;         /* la carpeta y su pestana activa */
  --txt:#2C3E50; --txt-suave:#55697A;

  /* EL TRAZO. Un solo marron para todo el dibujo, y es el fuerte:
     #6E4C36 sobre el tinte #F6EFE7 da 6,70:1, muy por encima del 3:1 que
     WCAG pide para lo que no es texto. Es lo que permite subirlo a 2px sin
     que se vea sucio. */
  --trazo:#6E4C36;
  --trazo-fino:#C9B49A;     /* el mismo marron lavado, para lo que solo separa */

  /* Las pestanas dormidas y las bloqueadas. Medido:
       apagada  #6E4C36 sobre #E7DACA = 5,56:1  (AA, se lee de sobra)
       bloqueada #8C7A66 sobre #EDE3D6 = 3,25:1 (apagada a proposito) */
  --pest-off:#E7DACA;
  --pest-lock:#EDE3D6; --pest-lock-txt:#8C7A66;

  --elegido:#FBF4EA;        /* el relleno calido de lo elegido, muy tenue */
  --salvia:#5A7060; --salvia-dp:#4A5E50;

  --display:Fraunces,Georgia,serif;
  --cuerpo:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:var(--display);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--tinte);color:var(--txt);
  font-family:var(--cuerpo);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.pnl-lienzo-ancho{background:var(--tinte)}

.hoja{padding:2.25rem 2.5rem 3.5rem;max-width:70rem}

h1{
  margin:0 0 1.5rem;
  font-family:var(--display);font-weight:600;
  font-size:1.95rem;line-height:1.15;letter-spacing:-.015em;
}

/* ---------- LAS PESTANAS ---------- */
.pestanas{display:flex;align-items:flex-end;padding-left:1.25rem}

.pest{
  display:flex;align-items:center;gap:.5rem;
  min-height:44px;padding:0 1.35rem;
  border:2px solid var(--trazo);border-bottom:0;
  border-radius:12px 12px 0 0;
  background:var(--pest-off);color:var(--trazo);
  font:inherit;font-size:.92rem;cursor:pointer;
  position:relative;
}
.pest svg{width:17px;height:17px;flex:none}

/* SE SOLAPAN, como separadores de archivador: cada una muerde a la anterior y
   la de mas a la izquierda queda por encima. */
.pest+.pest{margin-left:-14px}
.pest[data-p="1"]{z-index:3}
.pest[data-p="2"]{z-index:2}
.pest[data-p="3"]{z-index:1}

.pest:hover:not([aria-disabled="true"]):not([aria-selected="true"]){background:#EFE4D5}

/* LA ACTIVA: misma superficie que la carpeta, dos pixeles mas abajo para tapar
   su borde superior, y por encima de todas. Aqui se cose la costura. */
.pest[aria-selected="true"]{
  background:var(--blanco);font-weight:600;
  min-height:50px;margin-bottom:-2px;padding-bottom:2px;
  z-index:4;
}

/* BLOQUEADA: apagada Y anunciada como tal. Un gris sin `aria-disabled` deja a
   quien usa lector de pantalla pulsando algo que nunca va a responder. */
.pest[aria-disabled="true"]{
  background:var(--pest-lock);color:var(--pest-lock-txt);
  border-color:var(--trazo-fino);cursor:not-allowed;
}

/* HECHA: se puede volver, y se nota sin gritar. */
.pest[data-hecha]:not([aria-selected="true"]) .tic{display:inline}
.tic{display:none;color:var(--salvia)}

.pest:focus-visible{outline:2px solid var(--salvia);outline-offset:-4px}

/* ---------- LA CARPETA ----------
   Sin esquina arriba a la izquierda: ahi entra la primera pestana a ras. Si la
   activa no es la primera, la esquina vuelve — la carpeta se cierra por donde
   ya no cuelga nada. */
.carpeta{
  border:2px solid var(--trazo);border-radius:0 20px 20px 20px;
  background:var(--blanco);
  display:grid;grid-template-columns:17rem minmax(0,1fr);
  gap:1.5rem;padding:1.75rem;
}
/* OJO CON EL SELECTOR: las pestanas NO son descendientes de la carpeta, son su
   hermana anterior. La primera version escribio `.carpeta:has(.pest...)` y esa
   regla no podia aplicarse nunca — medida y confirmada en falso. Va con el
   combinador de hermano. */
.pestanas:has(.pest[data-p="1"]:not([aria-selected="true"])) + .carpeta{
  border-top-left-radius:20px;
}

/* ---------- CADA PREGUNTA, SU CAJA ---------- */
.bloque{
  border:2px solid var(--trazo);border-radius:14px;
  padding:1.25rem 1.35rem;min-width:0;
}
.bloque-ancho{grid-column:1 / -1}

legend{
  padding:0;margin:0 0 1rem;
  font-size:.74rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--txt-suave);
}
fieldset{border:0;padding:0;margin:0;min-width:0}

/* ---------- MODALIDAD ---------- */
.modos{display:flex;flex-direction:column;gap:.6rem}
.modo{position:relative;display:flex;align-items:center;gap:.7rem;
  min-height:46px;padding:0 1rem;cursor:pointer;
  border:1px solid var(--trazo-fino);border-radius:10px;font-size:.96rem}
.modo input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.modo svg{width:18px;height:18px;flex:none;color:var(--trazo)}
.modo:hover{background:var(--tinte)}
.modo:has(input:checked){border:2px solid var(--trazo);background:var(--elegido);
  font-weight:600;padding:0 calc(1rem - 1px)}
.modo:has(input:focus-visible){outline:2px solid var(--salvia);outline-offset:2px}

/* La direccion solo cuando hace falta. Con `:has()` no hace falta ni una linea
   de JavaScript para algo que es puramente una consecuencia de la eleccion. */
.lugar{display:none;margin:.9rem 0 0;padding:.85rem 1rem;
  border:1px dashed var(--trazo-fino);border-radius:10px;
  font-size:.86rem;line-height:1.5;color:var(--txt-suave)}
.bloque:has(input[value="presencial"]:checked) .lugar{display:block}
.lugar b{display:block;font-weight:600;color:var(--txt)}
.lugar a{color:var(--trazo);text-underline-offset:3px}

/* ---------- LAS TERAPIAS ----------
   SOLO EL NOMBRE. Sin foto, y sin icono ni disco de color que la sustituya;
   tampoco la descripcion al lado, que era lo que las hacia lentas de leer:
   cuatro frases a la vez obligan a leerlo todo para elegir una.

   Rejilla 2x2 y no cuatro filas: con el nombre solo, una fila se queda casi
   vacia en una columna de este ancho, y la rejilla se recorre de un golpe.

   El precio NO esta aqui — se decide en el bloque del plan, y ningun dato se
   repite entre bloques. */
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.op{
  position:relative;display:flex;align-items:center;
  min-height:52px;padding:0 1.1rem;cursor:pointer;
  border:1px solid var(--trazo-fino);border-radius:10px;
  font-family:var(--display);font-size:1.02rem;line-height:1.25;
}
.op input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.op:hover{background:var(--tinte)}
.op:has(input:checked){border:2px solid var(--trazo);background:var(--elegido);
  font-weight:600;padding:0 calc(1.1rem - 1px)}
.op:has(input:focus-visible){outline:2px solid var(--salvia);outline-offset:2px}

/* La frase que distingue, SOLO la de la elegida. Asi la informacion no se
   pierde pero se lee una sola vez, y la que importa. */
.detalle:not([hidden]){margin:.9rem 0 0;font-size:.88rem;line-height:1.5;color:var(--txt-suave)}

/* ---------- LOS PLANES ---------- */
.planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.plan{
  position:relative;display:flex;flex-direction:column;gap:.15rem;
  padding:1rem 1.1rem;cursor:pointer;
  border:1px solid var(--trazo-fino);border-radius:12px;
}
.plan input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.plan-nom{font-size:.93rem;color:var(--txt-suave)}
.plan-cifra{font-family:var(--display);font-size:1.5rem;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2}
/* El ahorro NO es una insignia verde. Un badge de oferta en una consulta de
   psicologia suena a rebajas; una nota al lado del precio dice lo mismo sin
   levantar la voz. */
.plan-nota{font-size:.78rem;color:var(--salvia);min-height:1.2em}
.plan:hover{background:var(--tinte)}
.plan:has(input:checked){border:2px solid var(--trazo);background:var(--elegido);
  padding:calc(1rem - 1px) calc(1.1rem - 1px)}
.plan:has(input:focus-visible){outline:2px solid var(--salvia);outline-offset:2px}

/* ---------- EL PIE DE LA CARPETA ----------
   El total vive aqui, pegado a la accion, que es donde se mira antes de
   pulsar. No se repite arriba: cada cifra aparece una sola vez. */
.acciones{
  grid-column:1 / -1;display:flex;align-items:center;
  justify-content:space-between;gap:1.5rem;flex-wrap:wrap;
  padding-top:1.35rem;border-top:2px solid var(--trazo);
}
.total{display:flex;align-items:baseline;gap:.6rem}
.total span{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--txt-suave)}
.total b{font-family:var(--display);font-size:1.85rem;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.seguir{
  display:flex;align-items:center;gap:.6rem;
  min-height:50px;padding:0 1.75rem;border:0;border-radius:999px;
  background:var(--salvia);color:#fff;font:inherit;font-size:.97rem;
  font-weight:600;cursor:pointer;
}
.seguir svg{width:18px;height:18px}
.seguir:hover{background:var(--salvia-dp)}
.seguir:focus-visible{outline:2px solid var(--trazo);outline-offset:3px}

/* Vuelve porque al esconder el pie del asistente se quedo sin estar visible en
   ningun paso, y las guias del sector insisten en que se alcance desde
   cualquier pagina. */
.legal{margin:1.1rem 0 0;font-size:.79rem;color:var(--txt-suave)}
.legal a{color:var(--trazo);text-underline-offset:3px}
</style>
</head>
<body>

<div class="pnl" data-menu="si">

  <!-- Menu estatico: aqui solo da contexto. En la pagina real lo pinta panel.js -->
  <nav class="pnl-menu" aria-label="Tu cuenta">
    <a class="pnl-marca" href="#">

      <span>Reservar cita</span></a>
    <div class="pnl-vistas">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>

      <a class="pnl-vista" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/></svg>
        <span>Mis datos</span></a>
    </div>
    <button type="button" class="pnl-salir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v2M11 12h10M18 9l3 3-3 3"/></svg>
      <span>Cerrar sesión</span></button>
  </nav>

  <div class="pnl-lienzo pnl-lienzo-ancho">
    <div class="hoja">

      <h1>Reserva tu consulta</h1>

      <!-- PESTANAS en vez de "1 de 3". La diferencia no es estetica: "Reserva ·
           Fecha · Pago" dice QUE es cada paso; "1 de 3" solo dice cuantos
           quedan.

           OJO CON LA TERCERA: en cuanto se reserva, la cita existe y el cupo
           esta tomado, asi que volver a las dos primeras deja de poder EDITAR.
           Se podran visitar, pero de solo lectura; cambiar algo pasa a ser
           reprogramar o cancelar. -->
      <div class="pestanas" role="tablist" aria-label="Pasos de la reserva">

        <button type="button" role="tab" class="pest" data-p="1" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h9"/></svg>
          Reserva <svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>

        <button type="button" role="tab" class="pest" data-p="2" aria-selected="false" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
          Fecha</button>

        <button type="button" role="tab" class="pest" data-p="3" aria-selected="false" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
          Pago</button>
      </div>

      <div class="carpeta">

        <!-- IZQUIERDA, ESTRECHO: la modalidad. Dos opciones, y por eso es la
             columna corta. -->
        <section class="bloque">
          <fieldset class="modos-caja">
            <legend>Cómo quieres tu consulta</legend>
            <div class="modos">
              <label class="modo"><input type="radio" name="modo" value="online" checked>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8 21h8M12 17.5V21"/></svg>
                En línea</label>

              <label class="modo"><input type="radio" name="modo" value="presencial">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
                Presencial</label>
            </div>
          </fieldset>

          <p class="lugar">
            <b>Consultorio</b>
            Av. Las Delicias, Torre Cristal, piso 4, consultorio 4-B. Maracay.
            <a href="#">Ver en el mapa</a>
          </p>
        </section>

        <!-- DERECHA, ANCHO: cuatro terapias con descripcion, y por eso es la
             columna larga. -->
        <section class="bloque">
          <fieldset>
            <legend>Qué quieres trabajar</legend>
            <div class="ops">
              <label class="op"><input type="radio" name="serv" value="ansiedad">Ansiedad</label>
              <label class="op"><input type="radio" name="serv" value="autoestima">Autoestima</label>
              <label class="op"><input type="radio" name="serv" value="pareja">Pareja</label>
              <label class="op"><input type="radio" name="serv" value="duelo">Duelo</label>
            </div>
          </fieldset>
          <p class="detalle" id="detalle" hidden></p>
        </section>

        <!-- ABAJO, CRUZANDO EL ANCHO: los planes y su precio. -->
        <section class="bloque bloque-ancho">
          <fieldset>
            <legend>Una consulta o un proceso</legend>
            <div class="planes">
              <label class="plan"><input type="radio" name="plan" value="1">
                <span class="plan-nom">Una consulta</span>
                <span class="plan-cifra js-p1">—</span>
                <span class="plan-nota">Para empezar y ver cómo te sientes</span></label>

              <label class="plan"><input type="radio" name="plan" value="3">
                <span class="plan-nom">Tres consultas</span>
                <span class="plan-cifra js-p3">—</span>
                <span class="plan-nota js-a3"></span></label>

              <label class="plan"><input type="radio" name="plan" value="5">
                <span class="plan-nom">Cinco consultas</span>
                <span class="plan-cifra js-p5">—</span>
                <span class="plan-nota js-a5"></span></label>
            </div>
          </fieldset>
        </section>

        <div class="acciones">
          <p class="total"><span>Total</span><b id="total">—</b></p>
          <button type="button" class="seguir">Ver horarios

        </div>
      </div>

      <p class="legal"><a href="../reservar/privacidad.html">Privacidad y consentimiento</a></p>

    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var PRECIO  = { ansiedad:30, autoestima:30, pareja:45, duelo:30 };
  var DETALLE = {
    ansiedad:  'Cuando los pensamientos no paran y la tensión te agota.',
    autoestima:'Si la autocrítica te pesa y te cuesta poner límites.',
    pareja:    'Cuando la comunicación se rompe o la distancia duele.',
    duelo:     'Hay pérdidas que cuesta mucho soltar.'
  };
  /* El precio por sesion baja con el bono, igual que en la semilla del
     proyecto: 25 frente a 30 en individual, 30 frente a 45 en pareja. */
  var POR_SESION = { 30:{1:30,3:25,5:25}, 45:{1:45,3:30,5:30} };

  function calcular() {
    var serv = (document.querySelector('input[name=serv]:checked')||{}).value || '';
    var plan = Number((document.querySelector('input[name=plan]:checked')||{}).value || 0);

    /* La frase de la terapia: solo la de la elegida, y nada mientras no haya
       ninguna. */
    var det = $('#detalle');
    det.hidden = !serv;
    if (serv) det.textContent = DETALLE[serv];

    /* SIN TERAPIA NO HAY PRECIO QUE ENSENAR. El del bono depende de ella —25 $
       por sesion en individual, 30 en pareja—, asi que poner una cifra antes de
       elegir seria inventarsela. Guion hasta entonces. */
    if (!serv) {
      [1,3,5].forEach(function (n) {
        $('.js-p' + n).textContent = '—';
        var a = $('.js-a' + n); if (a) a.textContent = '';
      });
      $('#total').textContent = '—';
      return;
    }

    var base = PRECIO[serv], tabla = POR_SESION[base] || POR_SESION[30];

    /* Los precios de los bonos siguen a la terapia: elegir pareja no puede
       dejar "75 $" escrito debajo cuando ya son 90. */
    [1,3,5].forEach(function (n) {
      $('.js-p' + n).innerHTML = (tabla[n] * n) + '&nbsp;$';
      var a = $('.js-a' + n);
      if (a) {
        var ahorro = (base * n) - (tabla[n] * n);
        a.textContent = ahorro > 0 ? 'ahorras ' + ahorro + ' $' : '';
      }
    });

    $('#total').textContent = plan ? (tabla[plan] * plan) + ' $' : '—';
  }

  /* La pestana siguiente se abre cuando esta contestado lo que hace falta. En
     el asistente de verdad "Fecha" se abre al tener terapia y plan, y "Pago"
     solo cuando la cita ya esta creada. */
  function abrirSiguiente() {
    var listo = !!document.querySelector('input[name=serv]:checked') &&
                !!document.querySelector('input[name=plan]:checked');
    var p1 = document.querySelector('.pest[data-p="1"]');
    var p2 = document.querySelector('.pest[data-p="2"]');

    /* SIMETRICO: tambien vuelve a bloquear. En el asistente de verdad, cambiar
       de terapia tira el plan elegido —los precios son otros y el paquete
       puede no existir en la modalidad nueva—, asi que "Fecha" tiene que
       cerrarse otra vez. Una pestana que solo sabe abrirse deja pasar a un
       paso con la pregunta anterior sin contestar. */
    if (listo) {
      p2.removeAttribute('aria-disabled');
      p1.dataset.hecha = 'si';
    } else {
      p2.setAttribute('aria-disabled', 'true');
      delete p1.dataset.hecha;
    }
  }

  document.addEventListener('change', function () { calcular(); abrirSiguiente(); });
  calcular();
  abrirSiguiente();
})();
</script>
</body>
</html>
