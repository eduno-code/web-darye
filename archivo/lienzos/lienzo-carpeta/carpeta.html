<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La carpeta · construcción correcta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">

<!-- ============================================================
     LA CARPETA, CON LA CONSTRUCCION DE LA REFERENCIA.

     Dos intentos anteriores fallaron por leer mal la referencia:
       · el primero puso las pestañas sobre una BANDA de color,
       · el segundo las metio DENTRO de la tarjeta con una linea debajo.
     Las dos cosas estan mal. Lo que hace la referencia:

       1. Las pestañas se apoyan en el FONDO de la pagina, por ENCIMA del
          borde superior de la tarjeta. No hay banda y no van dentro.
       2. Las dormidas estan INCLINADAS: el canto se tumba hacia la derecha.
          Se consigue con `skewX` en un pseudo-elemento, para que el texto de
          encima quede recto — con el skew en el propio boton, las letras
          saldrian torcidas.
       3. Se SOLAPAN mucho, y cada una queda por debajo de la anterior. El
          canto izquierdo inclinado no se ve porque lo tapa la de al lado; eso
          es lo que permite inclinar la forma entera con una sola propiedad.
       4. Van OSCURECIENDOSE hacia la derecha, no aclarandose: la mas lejana
          del contenido es la mas apagada.
       5. La activa es blanca, SIN inclinar, un poco mas alta, y se funde con
          la tarjeta: comparte relleno y se monta sobre su borde superior.
       6. NI UN BORDE. El dibujo lo hace la superficie y una sombra templada
          hacia el marron — una sombra neutra sobre fondo calido se ve gris.
     ============================================================ -->

<style>
:root{
  color-scheme:only light;
  --suelo:#F6EFE7;
  --blanco:#FFFFFF;
  --txt:#2C3E50; --txt-suave:#55697A;
  --marca:#6E4C36;

  /* Las pestañas dormidas, oscureciendose hacia la derecha. Medido sobre cada
     relleno, el texto #8C7A66 da 3,4:1 en la mas clara y 3,0:1 en la mas
     oscura: por encima del 3:1 de no-texto, y son estados apagados a
     proposito. La activa lleva #6E4C36 sobre blanco, 7,7:1. */
  --p1:#EFE4D5;
  --p2:#E8DACA;
  --p3:#E0D0BD;
  --p-txt:#8C7A66;

  --linea:rgba(166,123,91,.22);
  --elegido:#FBF4EA;
  --acc:#5A7060;

  --display:Fraunces,Georgia,serif;
  --texto:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

  /* Sombra TEÑIDA hacia el marron, nunca negra. */
  --sombra:0 1px 2px rgba(110,76,54,.05), 0 14px 36px -14px rgba(110,76,54,.20);
  --sombra-pest:0 -2px 6px -2px rgba(110,76,54,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--suelo);color:var(--txt);
  font-family:var(--texto);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}

.hoja{padding:2.5rem;max-width:64rem}
h1{margin:0 0 1.75rem;font-size:1.65rem;font-weight:600;letter-spacing:-.02em}

/* ---------- LA TIRA DE PESTAÑAS ----------
   `align-items:flex-end` y NO `baseline`: las pestañas tienen alturas
   distintas y lo que tiene que coincidir es su base, que es por donde se
   apoyan en la tarjeta. */
.tira{display:flex;align-items:flex-end;padding-left:1.5rem}

.pest{
  position:relative;
  display:flex;align-items:center;gap:.5rem;
  min-height:42px;padding:0 1.6rem;
  border:0;background:none;
  font:inherit;font-size:.9375rem;color:var(--p-txt);
  cursor:pointer;
}
.pest svg{width:16px;height:16px;flex:none}

/* LA FORMA. Va en un pseudo-elemento inclinado con `skewX` para que el texto
   de encima se quede recto. `transform-origin: bottom` mantiene la base
   pegada a la tarjeta mientras la parte de arriba se desplaza. */
.pest::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:var(--p1);
  border-radius:12px 12px 0 0;
  transform:skewX(-13deg);transform-origin:bottom left;
  box-shadow:var(--sombra-pest);
}
.pest:nth-of-type(2)::before{background:var(--p2)}
.pest:nth-of-type(3)::before{background:var(--p3)}

/* SE SOLAPAN. El orden de apilado desciende hacia la derecha, asi que cada
   una se mete por debajo de la anterior y su canto izquierdo queda tapado. */
.pest + .pest{margin-left:-1.6rem}
.pest:nth-of-type(1){z-index:3}
.pest:nth-of-type(2){z-index:2}
.pest:nth-of-type(3){z-index:1}

.pest:hover:not([aria-selected="true"]):not([aria-disabled="true"]){color:var(--marca)}

/* LA ACTIVA. Blanca, mas alta, recta —es la unica sin inclinar, porque es la
   que esta delante— y por encima de todas. Los 2 px de `margin-bottom`
   negativos son los que borran la costura con la tarjeta. */
.pest[aria-selected="true"]{
  color:var(--marca);font-weight:600;
  min-height:50px;margin-bottom:-2px;padding-bottom:2px;
  z-index:5;cursor:default;
}
.pest[aria-selected="true"]::before{
  background:var(--blanco);
  transform:none;
  border-radius:14px 14px 0 0;
  box-shadow:0 -1px 4px -1px rgba(110,76,54,.10);
}

.pest[aria-disabled="true"]{cursor:not-allowed;color:#A2927E}
.pest:focus-visible{outline:2px solid var(--acc);outline-offset:-4px;border-radius:12px 12px 0 0}

/* ---------- LA TARJETA ----------
   Sin borde. El radio de arriba a la izquierda se queda en 0 porque ahi entra
   la primera pestaña a ras; si la activa no es la primera, vuelve. */
.tarjeta{
  position:relative;
  background:var(--blanco);
  border:0;border-radius:0 18px 18px 18px;
  box-shadow:var(--sombra);
  padding:1.75rem;
}
.tira:has(.pest:nth-of-type(1):not([aria-selected="true"])) + .tarjeta{
  border-top-left-radius:18px;
}

/* ---------- DENTRO: SIN CAJAS ----------
   Las dos preguntas se separan con una divisoria de un pixel y la de planes
   con otra horizontal. Nada mas: al no haber caja por pregunta, el unico
   rectangulo de la pantalla es la tarjeta. */
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:2.5rem;align-items:start}
.rejilla > section:first-child{padding-right:2.5rem;box-shadow:1px 0 0 var(--linea)}

.rot{margin:0 0 1rem;font-size:.78rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--txt-suave)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}

.op{display:flex;align-items:center;gap:.85rem;min-height:48px;
  padding:0 .5rem;margin:0 -.5rem;border-radius:8px;cursor:pointer;font-size:1rem}
.op input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.dot{flex:none;width:18px;height:18px;border-radius:50%;
  border:1.5px solid #C9B49A;box-sizing:border-box}
.op:has(input:checked) .dot{border-color:var(--marca);background:var(--marca);
  box-shadow:inset 0 0 0 3.5px var(--blanco)}
.op:has(input:checked){font-weight:600}
.op + .op{box-shadow:inset 0 1px 0 var(--linea)}
.op:hover{background:var(--suelo)}
.op:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:1px}

.zona-planes{margin-top:1.75rem;padding-top:1.75rem;box-shadow:inset 0 1px 0 var(--linea)}
.planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.plan{position:relative;display:flex;flex-direction:column;gap:.15rem;
  padding:1rem 1.1rem;border-radius:12px;background:#FBF7F1;cursor:pointer}
.plan input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.plan:hover{background:#F8F2E9}
.plan:has(input:checked){background:var(--elegido);
  box-shadow:inset 0 0 0 1.5px var(--marca)}
.plan:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.plan-cab{display:flex;align-items:baseline;gap:.35rem;flex-wrap:wrap;
  font-size:.88rem;color:var(--txt-suave)}
.plan-precio{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;line-height:1.2}
.plan-ahorro{font-size:.78rem;color:var(--acc);min-height:1.2em}

.nota{display:flex;align-items:center;gap:.4rem;margin:.9rem 0 0;
  font-size:.78rem;color:var(--txt-suave)}
.nota svg{width:14px;height:14px}

.pie{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  flex-wrap:wrap;margin-top:1.75rem;padding-top:1.35rem;
  box-shadow:inset 0 1px 0 var(--linea)}
.total{display:flex;align-items:baseline;gap:.6rem;margin:0}
.total span{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-suave)}
.total b{font-size:1.65rem;font-weight:600;font-variant-numeric:tabular-nums}
.seguir{display:flex;align-items:center;gap:.6rem;min-height:48px;padding:0 1.6rem;
  border:0;border-radius:999px;background:var(--acc);color:#fff;
  font:inherit;font-size:.97rem;font-weight:600;cursor:pointer}
.seguir svg{width:18px;height:18px}
.seguir:hover{background:#4A5E50}
.legal{margin:1.1rem 0 0;font-size:.79rem;color:var(--txt-suave)}
.legal a{color:var(--marca);text-underline-offset:3px}
</style>
</head>
<body>

<div class="hoja">
  <h1>Reserva tu consulta</h1>

  <div class="tira" role="tablist" aria-label="Pasos de la reserva">
    <button type="button" role="tab" class="pest" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h9"/></svg>
      Reserva</button>
    <button type="button" role="tab" class="pest" aria-selected="false" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
      Fecha</button>
    <button type="button" role="tab" class="pest" aria-selected="false" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
      Pago</button>
  </div>

  <div class="tarjeta">
    <div class="rejilla">
      <section>
        <fieldset>
          <legend class="rot">Cómo quieres tu consulta</legend>
          <label class="op"><input type="radio" name="modo" checked><span class="dot"></span><span>En línea</span></label>
          <label class="op"><input type="radio" name="modo"><span class="dot"></span><span>Presencial</span></label>
        </fieldset>
      </section>
      <section>
        <fieldset>
          <legend class="rot">Qué quieres trabajar</legend>
          <label class="op"><input type="radio" name="serv" checked><span class="dot"></span><span>Superar la Ansiedad</span></label>
          <label class="op"><input type="radio" name="serv"><span class="dot"></span><span>Fortalecer tu Autoestima</span></label>
          <label class="op"><input type="radio" name="serv"><span class="dot"></span><span>Sanar en Pareja</span></label>
          <label class="op"><input type="radio" name="serv"><span class="dot"></span><span>Acompañar un Duelo</span></label>
        </fieldset>
      </section>
    </div>

    <div class="zona-planes">
      <fieldset>
        <legend class="rot">Una consulta o un proceso</legend>
        <div class="planes">
          <label class="plan"><input type="radio" name="plan" checked>
            <span class="plan-cab"><span>1</span><span>Consulta</span></span>
            <span class="plan-precio">30&nbsp;$</span>
            <span class="plan-ahorro"></span></label>
          <label class="plan"><input type="radio" name="plan">
            <span class="plan-cab"><span>3</span><span>Consultas</span></span>
            <span class="plan-precio">75&nbsp;$</span>
            <span class="plan-ahorro">Ahorras 15 $</span></label>
          <label class="plan"><input type="radio" name="plan">
            <span class="plan-cab"><span>5</span><span>Consultas</span></span>
            <span class="plan-precio">125&nbsp;$</span>
            <span class="plan-ahorro">Ahorras 25 $</span></label>
        </div>
        <p class="nota">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
          60 días para agendar tus consultas</p>
      </fieldset>
    </div>

    <div class="pie">
      <p class="total"><span>Total</span><b>30 $</b></p>
      <button type="button" class="seguir">Ver horarios
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg></button>
    </div>
  </div>

  <p class="legal"><a href="../reservar/privacidad.html">Privacidad y consentimiento</a></p>
</div>

</body>
</html>
