<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Cuánta decoración aguanta el panel?</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TRES NIVELES DE DECORACION EN EL PANEL

   El panel es identico en las tres: misma marca, misma invitacion, misma nota
   de privacidad, mismos colores. Lo unico que cambia es cuanta forma hay
   detras. Recortado a la mitad derecha de la pantalla de escritorio, que es
   donde vive el panel.
   ============================================================ */
:root{
  --papel:#EFE9E0; --tinta:#2E332E; --suave:#5C635A;
  --arcilla:#C6A783; --arcilla-dp:#8A6746; --salvia:#5A7060;
  --panel-fondo:#5E442C; --panel-txt:#FAF3EA; --panel-txt-sv:#E2D5C4;
  --panel-linea:#B99A78;
  --orn-a:#533A25; --orn-b:#4E3722;
  color-scheme:only light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font:400 14px/1.55 Inter,"Segoe UI",system-ui,sans-serif}

header.barra{padding:1.4rem 1.4rem .2rem;max-width:72rem;margin-inline:auto}
header.barra h1{margin:0 0 .3rem;font:600 1.15rem/1.2 Fraunces,Georgia,serif;letter-spacing:-.02em}
header.barra p{margin:0;color:var(--suave);max-width:64ch}

.escena{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;
  align-items:flex-start;padding:2rem 1.4rem 4rem;max-width:72rem;margin-inline:auto}
figure{margin:0;width:340px;display:flex;flex-direction:column;gap:.75rem}
figcaption b{display:block;font:600 .95rem/1.3 Inter,sans-serif}
figcaption .que{display:block;font-size:.8rem;color:var(--suave);margin-top:.15rem}

.panel{width:340px;height:520px;position:relative;overflow:hidden;border-radius:10px;
  background:var(--panel-fondo);color:var(--panel-txt);
  padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem}
.panel > *{position:relative;z-index:1}
.panel::before,.panel::after{content:"";position:absolute;aspect-ratio:1;
  border-radius:50%;z-index:0;pointer-events:none;display:none}

.marca{display:flex;align-items:center;gap:.5rem;margin:0;font-size:.78rem;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.marca svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.1;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.invita{margin:auto 0;display:flex;flex-direction:column;align-items:center;
  gap:.8rem;text-align:center}
.invita h2{margin:0;font:600 1.6rem/1.08 Fraunces,Georgia,serif;letter-spacing:-.03em}
.invita p{margin:0;font-size:.86rem;color:var(--panel-txt-sv);max-width:26ch}
.invita button{appearance:none;cursor:pointer;font:inherit;font-size:.86rem;font-weight:600;
  color:var(--panel-txt);background:transparent;border:1px solid var(--panel-linea);
  border-radius:999px;padding:.65rem 1.7rem;min-height:44px}
.pie{margin:0;display:flex;gap:.55rem;align-items:flex-start;font-size:.78rem;
  line-height:1.5;color:var(--panel-txt-sv);border-left:2px solid var(--salvia);
  padding-left:.8rem}
.pie svg{flex:none;width:14px;height:14px;margin-top:.2rem;color:var(--salvia)}

.dato{margin:0;font-size:.78rem;line-height:1.5;border-left:2px solid currentColor;
  padding-left:.7rem}
.dato b{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}
.dato span{color:var(--tinta);display:block;margin-top:.2rem}
.si{color:#3E6B4F} .medio{color:#8A6A14} .no{color:#A33A2E}

/* --- 1 · sin nada --- */

/* --- 2 · una sola, muy sutil --- */
#dos .panel::before{display:block;width:74%;right:-22%;top:-16%;background:var(--orn-a)}

/* --- 3 · las dos de ahora --- */
#tres .panel::before{display:block;width:78%;right:-20%;top:-28%;background:var(--orn-a)}
#tres .panel::after{display:block;width:98%;left:-44%;bottom:-42%;background:var(--orn-b)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bombilla" viewBox="0 0 24 24">
    <path d="M12 2.1A7.2 7.2 0 0 0 7.8 15.15c.55.4.8 1 .8 1.7v.75h6.8v-.75c0-.7.25-1.3.8-1.7A7.2 7.2 0 0 0 12 2.1Z"/>
    <path d="M9 20h6M10.2 22.2h3.6"/>
    <path d="M12 9.6A.8.8 0 0 1 12 8A1.7 1.7 0 0 1 12 11.4A3 3 0 0 1 12 5.4"/>
  </symbol>
  <symbol id="candado" viewBox="0 0 24 24">
    <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>
  <symbol id="cuerpo" viewBox="0 0 1 1"></symbol>
</svg>

<header class="barra">
  <h1>¿Cuánta decoración aguanta el panel?</h1>
  <p>El panel es idéntico en las tres: misma marca, misma invitación, misma nota, mismos colores. Lo único que cambia es cuánta forma hay detrás.</p>
</header>

<main class="escena">

  <figure id="una">
    <figcaption><b>1 · Sin nada</b><span class="que">Marrón liso. Es lo que hace el resto del producto: la landing no tiene ni una forma decorativa de fondo.</span></figcaption>
    <div class="panel">
      <p class="marca"><svg><use href="#bombilla"/></svg>Psicconsciente</p>
      <div class="invita">
        <h2>¿Primera vez aquí?</h2>
        <p>Crea tu cuenta y reserva tu consulta en dos minutos.</p>
        <button type="button">Crear cuenta</button>
      </div>
      <p class="pie"><svg><use href="#candado"/></svg><span>Solo se guardan tu nombre, tu correo y tu teléfono.</span></p>
    </div>
    <p class="dato si"><b>Coherente</b><span>No introduce ningún lenguaje visual nuevo. El color hace todo el trabajo, que es exactamente lo que hace la landing.</span></p>
  </figure>

  <figure id="dos">
    <figcaption><b>2 · Una sola, alta</b><span class="que">Un solo círculo en la esquina de arriba, lejos del texto. Da profundidad sin llenar el panel.</span></figcaption>
    <div class="panel">
      <p class="marca"><svg><use href="#bombilla"/></svg>Psicconsciente</p>
      <div class="invita">
        <h2>¿Primera vez aquí?</h2>
        <p>Crea tu cuenta y reserva tu consulta en dos minutos.</p>
        <button type="button">Crear cuenta</button>
      </div>
      <p class="pie"><svg><use href="#candado"/></svg><span>Solo se guardan tu nombre, tu correo y tu teléfono.</span></p>
    </div>
    <p class="dato medio"><b>El punto medio</b><span>Se nota que hay algo detrás sin que compita. Y al estar arriba no toca ni la invitación ni la nota.</span></p>
  </figure>

  <figure id="tres">
    <figcaption><b>3 · Las dos de ahora</b><span class="que">Lo que está puesto ahora mismo en la página.</span></figcaption>
    <div class="panel">
      <p class="marca"><svg><use href="#bombilla"/></svg>Psicconsciente</p>
      <div class="invita">
        <h2>¿Primera vez aquí?</h2>
        <p>Crea tu cuenta y reserva tu consulta en dos minutos.</p>
        <button type="button">Crear cuenta</button>
      </div>
      <p class="pie"><svg><use href="#candado"/></svg><span>Solo se guardan tu nombre, tu correo y tu teléfono.</span></p>
    </div>
    <p class="dato no"><b>Lo que cuesta</b><span>Dos discos que ocupan casi todo el panel. Es la única decoración pura del producto entero, así que en vez de sonar a marca suena a que esta pantalla la hizo otro.</span></p>
  </figure>

</main>
</body>
</html>
