<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Psicconsciente</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">

<link rel="stylesheet" href="entrar.ANTES-AUDITORIA.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="i-ojo-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S6 5.5 12 5.5c1.5 0 2.8.4 4 1M21.5 12S18 18.5 12 18.5c-1.5 0-2.8-.4-4-1"/><path d="m4 4 16 16"/>
  </symbol>
  <symbol id="i-ir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-candado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </symbol>
</svg>

<div class="puerta" id="puerta" data-modo="registro">


  <!-- ============ ENTRAR · mitad izquierda ============ -->
  <form class="cara" id="vEntrar" novalidate>
    <div class="panel">
      <div class="encabezado">
        <h1>¡Hola de nuevo!</h1>
        <p>Qué bueno tenerte por aquí. Ingresa para gestionar tus consultas.</p>
      </div>

      <div class="campos anima">
        <p class="campo" style="--i:1">
          <label for="eMail">Correo electrónico</label>
          <input type="email" id="eMail" name="correo" autocomplete="email" inputmode="email"
                 placeholder="maria@correo.com" required aria-describedby="eeCorreo">
          <span class="err" id="eeCorreo" role="alert"></span>
        </p>

        <p class="campo" style="--i:2">
          <label for="eClaveIn">Contraseña</label>
          <span class="clave">
            <input type="password" id="eClaveIn" name="clave" autocomplete="current-password"
                   placeholder="Tu contraseña" required aria-describedby="eeClave">
            <button type="button" class="ojo" data-ojo="eClaveIn" aria-pressed="false" aria-label="Mostrar la contraseña">
              <svg class="abierto" aria-hidden="true"><use href="#i-ojo"/></svg>
              <svg class="tachado" aria-hidden="true"><use href="#i-ojo-no"/></svg>
            </button>
          </span>
          <span class="err" id="eeClave" role="alert"></span>
        </p>

        <button type="submit" class="btn" style="--i:3">
          <span>Entrar</span>
          <span class="rueda" aria-hidden="true"></span>
        </button>

        <p class="pie-panel" style="--i:4"><a href="#">No recuerdo mi contraseña</a></p>
      </div>
    </div>
  </form>

  <!-- ============ CREAR CUENTA · mitad derecha ============ -->
  <form class="cara" id="vRegistro" novalidate>
    <div class="panel">
      <div class="encabezado">
        <h1>Crea tu cuenta</h1>
      </div>

      <div class="campos anima">
        <p class="campo" style="--i:1">
          <label for="rNombre">Nombre y apellido</label>
          <input type="text" id="rNombre" name="nombre" autocomplete="name"
                 placeholder="María Fernández" required aria-describedby="eNombre">
          <span class="err" id="eNombre" role="alert"></span>
        </p>

        <p class="campo" style="--i:2">
          <label for="rCorreo">Correo electrónico</label>
          <input type="email" id="rCorreo" name="correo" autocomplete="email" inputmode="email"
                 placeholder="maria@correo.com" required aria-describedby="eCorreo">
          <span class="err" id="eCorreo" role="alert"></span>
        </p>

        <p class="campo" style="--i:3">
          <label for="rClave">Contraseña</label>
          <span class="clave">
            <!-- Sin bloquear el pegado y con autocomplete: es lo que permite que
                 un gestor de contrasenas la rellene y la guarde. Bloquearlo
                 incumple la WCAG 2.2. -->
            <input type="password" id="rClave" name="clave" autocomplete="new-password"
                   placeholder="Mínimo 8 caracteres" minlength="8" required aria-describedby="eClave">
            <button type="button" class="ojo" data-ojo="rClave" aria-pressed="false" aria-label="Mostrar la contraseña">
              <svg class="abierto" aria-hidden="true"><use href="#i-ojo"/></svg>
              <svg class="tachado" aria-hidden="true"><use href="#i-ojo-no"/></svg>
            </button>
          </span>
          <span class="err" id="eClave" role="alert"></span>
        </p>

        <p class="campo" style="--i:4">
          <label for="rTel">Teléfono</label>
          <span class="tel">
            <!-- El prefijo es un control propio y no una etiqueta fija: alguien
                 que vive en Espana puede conservar su numero venezolano. -->
            <label class="sr-only" for="rPrefijo">Código de país del teléfono</label>
            <select class="prefijo" id="rPrefijo" name="prefijo"></select>
            <input type="tel" id="rTel" name="telefono" autocomplete="tel-national" inputmode="tel"
                   placeholder="412 123 4567" required aria-describedby="eTel">
          </span>
          <span class="err" id="eTel" role="alert"></span>
        </p>

      <!-- Agrupamos Nacionalidad y País en la misma línea -->
        <div class="fila-doble">
          <p class="campo" style="--i:5">
            <label for="rNac">Nacionalidad</label>
            <select id="rNac" name="nacionalidad" required></select>
          </p>

          <p class="campo" style="--i:6">
            <label for="rPais">País donde vives</label>
            <select id="rPais" name="pais" autocomplete="country-name" required></select>
          </p>
        </div>

        <button type="submit" class="btn" style="--i:7">
          <span>Crear cuenta</span>
          <span class="rueda" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </form>

  <!-- ============ EL PANEL QUE VIAJA ============ -->
  <aside class="banda" aria-label="Psicconsciente">
    
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path pathLength="1" d="M12 2.1A7.2 7.2 0 0 0 7.8 15.15c.55.4.8 1 .8 1.7v.75h6.8v-.75c0-.7.25-1.3.8-1.7A7.2 7.2 0 0 0 12 2.1Z"/>
        <path pathLength="1" d="M9 20h6M10.2 22.2h3.6"/>
        <path pathLength="1" d="M12 9.6A.8.8 0 0 1 12 8A1.7 1.7 0 0 1 12 11.4A3 3 0 0 1 12 5.4"/>
      </svg>
      <p>Psicconsciente</p>
    </div>

    <div class="invita" id="invita">
      <h2 id="invitaTit">¿Ya tienes cuenta?</h2>
      <p id="invitaSub">Entra y sigue donde lo dejaste.</p>
      <button type="button" id="cambiar">Entrar</button>
    </div>

    <p class="banda-pie">
      <svg aria-hidden="true"><use href="#i-candado"/></svg>
      <span>Solo se guardan tu nombre, tu correo y tu teléfono. Nada de lo que hables en consulta se registra aquí.</span>
    </p>
  </aside>

</div>

<script src="entrar.ANTES-AUDITORIA.js"></script>
</body>
</html>
